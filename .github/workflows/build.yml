name: Release Hinge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hinge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build prototype installer
        env:
          HINGE_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package.sh
      - name: Save installer
        uses: actions/upload-artifact@v7
        with:
          name: Hinge-macOS
          path: |
            dist/Hinge.dmg
            dist/Hinge.dmg.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          tag="v${version}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Download Hinge.dmg, open it, and drag Hinge into Applications.

          Apple silicon MacBook, macOS 14 or later, and a supported lid sensor required. Allow Screen Recording when prompted. This prototype is not notarized; macOS may require approving it under Privacy & Security before first launch.
          NOTES
          gh release create "$tag" --target "$GITHUB_SHA" --title "Hinge $version" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          gh release upload "$tag" dist/Hinge.dmg dist/Hinge.dmg.sha256
          gh release edit "$tag" --draft=false --latest
